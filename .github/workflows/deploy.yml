name: Build and Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/edwardmelendezm/indagio-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # IMPORTANTE: Para crear el tag de versión en el repo
      packages: write   # Para subir la imagen a GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Run Tests
        run: go test -v ./...

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Calcular e incrementar versión (Minor bump: 1.1.0 -> 1.2.0)
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Build con el nuevo tag de versión
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.tag_version.outputs.new_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      # 3. Deploy usando el tag de versión generado
      - name: Deploy to Dokku
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DOKKU_HOST }}
          username: root
          key: ${{ secrets.DOKKU_DEPLOY_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u edwardmelendezm --password-stdin
            echo "${{ secrets.GHCR_PAT }}" | sudo -u dokku docker login ghcr.io -u edwardmelendezm --password-stdin
            dokku git:from-image ${{ secrets.DOKKU_APP }} \
            ${{ env.IMAGE }}:${{ steps.tag_version.outputs.new_tag }}
            # Healthcheck contra el endpoint /healthz que expone el Dockerfile.
            # Si el binario falla por mismatch de libc (ver Dockerfile, build con
            # CGO_ENABLED=1 + -extldflags=-static) el contenedor queda unhealthy
            # y Dokku deja de reiniciarlo en loop silencioso.
            dokku ps:healthcheck:set ${{ secrets.DOKKU_APP }} /healthz || true